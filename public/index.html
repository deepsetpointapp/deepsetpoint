<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>DeepSetpoint</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f4c430 0%, #e6b800 50%, #b8860b 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow: hidden;
    }
    h1 {
      font-size: clamp(2.5rem, 7.5vw, 3.2rem);
      letter-spacing: 0.05em;
      font-weight: 900;
      color: #ffd700;
      text-shadow: 0 4px 12px rgba(0,0,0,0.35);
      margin-bottom: 1rem;
      line-height: 1.1;
    }
    p {
      font-size: clamp(1.4rem, 4.5vw, 1.9rem);
      color: white;
      text-shadow: 0 3px 8px rgba(0,0,0,0.25);
      margin-bottom: 2.5rem;
      line-height: 1.4;
      text-align: center;
      max-width: 500px;
    }
    button {
      padding: 0.45rem 1rem;
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      color: #1a1a1a;
      border: none;
      border-radius: 1.2rem;
      font-size: clamp(1.1rem, 3.5vw, 1.4rem);
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255,215,0,0.5);
      transition: all 0.25s ease;
      max-width: 14rem;
      width: auto;
      min-height: 2.8rem;
    }
    button:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 25px rgba(255,215,0,0.65);
    }
    #intro-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 10000;
      background: #000;
    }
    #skip-btn {
      position: absolute;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: 0.25rem 0.5rem;
      background: rgba(0,0,0,0.7);
      color: white;
      border: none;
      border-radius: 0.6rem;
      font-size: 0.85rem;
      min-height: 2rem;
      z-index: 10001;
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="home-screen">
    <h1>DeepSetpoint</h1>
    <p>The 18 Second DSP-Shift<br>Your daily emotional anchor</p>
    <button id="start-btn">Start Experience</button>
  </div>

  <script>
  // Disable right-click everywhere
  document.addEventListener('contextmenu', e => e.preventDefault());
    document.getElementById('start-btn').addEventListener('click', () => {
      // Hide home screen
      document.getElementById('home-screen').style.display = 'none';

      // Create fullscreen video
      const video = document.createElement('video');
      video.id = 'intro-video';
      video.src = '/intro.mp4';
      video.playsInline = true;
      video.disablePictureInPicture = true;
      video.muted = false;
      video.volume = 1.0;

      const skipBtn = document.createElement('button');
      skipBtn.id = 'skip-btn';
      skipBtn.textContent = 'SKIP';
      skipBtn.onclick = () => {
        window.location.href = '/home.html';
      };

      document.body.appendChild(video);
      document.body.appendChild(skipBtn);

      // Play with sound (allowed because of user click)
      video.play().catch(() => {
        video.muted = true;
        video.play();
      });

      video.onended = () => {
        window.location.href = '/home.html';
      };
    });
  </script>
</body>
</html>
